<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Experiences</title>
  <style>
    :root { --ink:#1a1a17; --dim:#6b675e; --accent:#8a6d1f; --line:#e4e0d6; }
    * { box-sizing:border-box; }
    body {
      margin:0; padding:clamp(24px,6vw,64px);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color:var(--ink); background:#faf8f3; line-height:1.6;
    }
    .wrap { max-width:680px; margin:0 auto; }
    h1 { font-size:1.6rem; margin:0 0 6px; letter-spacing:-.01em; }
    .sub { color:var(--dim); margin:0 0 36px; }
    ul { list-style:none; padding:0; margin:0; }
    li { border-top:1px solid var(--line); }
    li:last-child { border-bottom:1px solid var(--line); }
    a { display:block; padding:20px 4px; text-decoration:none; color:inherit; }
    a:hover { background:#f3efe5; }
    a:focus-visible { outline:3px solid var(--accent); outline-offset:-3px; }
    .title { font-weight:600; font-size:1.05rem; }
    .desc { color:var(--dim); font-size:.92rem; }
    footer { margin-top:40px; color:var(--dim); font-size:.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AR Experiences</h1>
    <p class="sub">Open a link below on a phone or tablet. Each experience needs camera access.</p>

    <ul>
      <!-- Add one entry per experience as you build them. -->
      <li>
        <a href="./experiences/_template/">
          <span class="title">Template</span><br>
          <span class="desc">Starter scaffold — duplicate this to begin a new experience.</span>
        </a>
      </li>
    </ul>

    <footer>Built with <a href="https://hiukim.github.io/mind-ar-js-doc/">MindAR</a> and A-Frame.</footer>
  </div>
</body>
</html>
